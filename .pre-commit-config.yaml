repos:
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        language_version: python3.11
  - repo: https://github.com/pycqa/ruff-pre-commit
    rev: v0.0.281
    hooks:
      - id: ruff
        args: ["check", "src", "tests"]
  - repo: https://github.com/pre-commit/mirrors-isort
    rev: v5.13.0
    hooks:
      - id: isort
        args: ["--profile", "black", "src", "tests"]
