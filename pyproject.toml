[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-bot"
version = "0.1.0"
description = "Hybrid technical analysis and machine learning trading bot for Binance Futures"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.5.6",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "ta>=0.11.0",
    "scikit-learn>=1.5.0",
    "xgboost>=2.1.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "apscheduler>=3.10.0",
    "plotly>=5.20.0",
    "streamlit>=1.35.0",
    "rich>=13.7.0",
    "joblib>=1.4.0",
    "polars>=1.0.0",
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
]
authors = [
    {name = "AI Trading Bot Contributors"},
]
readme-content-type = "text/markdown"
license = {text = "MIT"}
keywords = ["trading", "binance", "backtest", "machine-learning", "quant"]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "black>=24.3.0",
    "ruff>=0.0.281",
    "isort>=5.13.0",
    "mypy>=1.8.0",
]
ml = [
    "tensorflow>=2.15.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["src"]
include-package-data = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
extend-exclude = ["venv", "data", "dist", "build", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C", "Q"]

[tool.isort]
profile = "black"

[tool.mypy]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
omit = [
    "src/__main__.py",
]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_empty = true
