name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install black isort ruff mypy pytest pytest-asyncio pytest-cov

      - name: Run smoke checks
        env:
          BINANCE_TESTNET: "true"
          BINANCE_API_KEY: "ci-key"
          BINANCE_API_SECRET: "ci-secret"
          AUDIT_DB_PATH: "data/audit/ci_audit.db"
        run: python scripts/smoke_check.py --fast

      - name: Offline backtest smoke
        env:
          BINANCE_TESTNET: "true"
        run: python -m src.main --mode backtest --offline --limit 120
